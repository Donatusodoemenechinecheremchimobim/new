<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="orangeDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e21" />
      <stop offset="100%" stop-color="#e15000" />
    </linearGradient>
    <linearGradient id="cyanDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e21" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container Background for perfect tab display -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-dasharray="16 12" />
  
  <!-- Active Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Left Wing (Cyan Drop Segment) -->
  <path d="M256 90 C210 145, 140 230, 140 310 C140 374, 192 426, 256 426 C256 426, 256 340, 256 310 C256 220, 256 140, 256 90 Z" fill="url(#cyanDrop)" />
        
  <!-- Right Wing (Orange Drop Segment, symmetric layout overlay) -->
  <path d="M256 90 C302 145, 372 230, 372 310 C372 374, 320 426, 256 426 C256 426, 256 340, 256 310 C256 220, 256 140, 256 90 Z" fill="url(#orangeDrop)" opacity="0.92" />
        
  <!-- Sleek Chemical Molecular Link Overlay -->
  <circle cx="256" cy="230" r="14" fill="#ffffff" />
  <circle cx="210" cy="310" r="10" fill="#ffffff" />
  <circle cx="302" cy="310" r="10" fill="#ffffff" />
  
  <!-- Connecting Bond Lines -->
  <line x1="256" y1="230" x2="210" y2="310" stroke="#ffffff" stroke-width="4" />
  <line x1="256" y1="230" x2="302" y2="310" stroke="#ffffff" stroke-width="4" />
  <line x1="210" y1="310" x2="302" y2="310" stroke="#ffffff" stroke-width="4" stroke-dasharray="4 4" />
  
  <!-- Sleek Inner Core Highlight -->
  <path d="M256 130 C230 180, 180 250, 180 310 C180 340, 200 370, 230 380" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
</svg>
